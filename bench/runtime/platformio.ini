; etask runtime benchmark - flash to a board and read the table over serial at 115200 baud.
;
;   cd bench/runtime
;   pio run -e esp32dev -t upload && pio device monitor -b 115200
;
; Unlike the static suite in ../platformio.ini, this one needs hardware attached.
;
; Identify the chip before flashing; do not infer it from the USB descriptor. An ESP32-S3 can
; enumerate as 10C4:EA60 (CP2102), exactly as a classic ESP32 does:
;
;   $(head -1 $(which pio) | sed 's/^#!//') \
;     ~/.platformio/packages/tool-esptoolpy/esptool.py --port /dev/ttyUSB0 chip_id
;
; `pio device monitor` needs a TTY and crashes in a non-interactive shell; read the port with
; pyserial instead, toggling DTR/RTS to reset so setup() output is captured.
;
; Board coverage. ESP32 / WROOM-32 / WROOM-32U are one target (esp32dev): same ESP32-D0WD die,
; same LX6 core, byte-identical firmware. The S3 is a genuinely different target (LX7).

[platformio]
src_dir = src

[env]
framework = arduino
; -O2 for the runtime table: this measures speed, so the speed-optimized build is the relevant
; one. The size suite reports -Os separately, and relative overhead differs between them.
;
; lib_extra_dirs points at elib/ so etask, etools, ecomm and eser all resolve from the WORKING
; TREE rather than the PlatformIO registry. ecomm in particular is under active local development
; and its tree differs from the published 3.0.1 - a registry build would measure different code.
build_flags = -std=gnu++17 -O2 -DNDEBUG
build_unflags = -std=gnu++11 -std=gnu++14
build_type = release
lib_extra_dirs = /home/mark/Desktop/projects/elib
lib_ldf_mode = deep+
monitor_speed = 115200

; ESP32-D0WD (LX6). GCC 8.4 - the older of the two Espressif toolchains.
[env:esp32dev]
platform = espressif32
board = esp32dev

; ESP32-S3-WROOM-1 (LX7). Also GCC 8.4, but a different core.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1

; ESP8266 NodeMCU (v2 and v3 alike - same ESP-12E target). GCC 10.3, and only 80 MHz.
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2

; ---------------------------------------------------------------------------------------------
; Heap track. Same boards, but -D BENCH_HEAP swaps src/main.cpp out for src/heap.cpp (each is
; wrapped in the matching guard, so exactly one defines setup()/loop()).
;
;   pio run -e heap_esp32dev -t upload
;
; Reports what etask allocates at construction, that steady-state traffic allocates nothing, and
; what happens when max_task_load is under-declared and the vector must grow mid-flight.
; ---------------------------------------------------------------------------------------------

[env:heap_esp32dev]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -D BENCH_HEAP

[env:heap_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D BENCH_HEAP

[env:heap_nodemcuv2]
platform = espressif8266
board = nodemcuv2
build_flags = ${env.build_flags} -D BENCH_HEAP
