; etask WiFi round-trip firmware. Needs hardware AND a WiFi network.
;
;   cd bench/wifi/firmware
;   pio run -e esp32dev -t upload
;   # read the IP the board prints over serial at 115200, then:
;   python3 ../roundtrip.py --host <that-ip>
;
; Credentials are build flags so they are never committed. Set them here, or override per run:
;
;   pio run -e esp32dev -t upload \
;     --project-option='build_flags=-std=gnu++17 -O2 -DNDEBUG -DBENCH_SSID=\"net\" -DBENCH_PASS=\"pw\"'
;
; The PC harness and this firmware must agree on the packet shape exactly - 32 bytes, network
; topology, no checksum. Changing one without the other produces silent framing mismatches, not
; an error.

[platformio]
src_dir = src

[env]
framework = arduino
build_type = release
; -O2: this measures latency, so the speed-optimized build is the relevant one.
; Credentials default to placeholders that fail loudly at runtime rather than silently.
build_flags =
  -std=gnu++17
  -O2
  -DNDEBUG
  -DBENCH_PORT=3333
  '-DBENCH_SSID="set-BENCH_SSID"'
  '-DBENCH_PASS="set-BENCH_PASS"'
  ; This node's identity on the wire; roundtrip.py's --board-id must match.
  -DECOMM_BOARD_ID=1
build_unflags = -std=gnu++11 -std=gnu++14
; Resolve etask/etools/ecomm/eser from the working tree, not the registry - ecomm's tree differs
; from the published 3.0.1.
lib_extra_dirs = /home/mark/Desktop/projects/elib
lib_ldf_mode = deep+
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
