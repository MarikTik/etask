; etask on PlatformIO - a minimal ESP8266 project.
;
; The whole integration is the `extra_scripts` line: it checks on every build
; that the generated code still matches schema.yaml, and adds the target that
; regenerates it.
;
;   pio run                     build (refuses if the schema moved ahead)
;   pio run -t etask-generate   rewrite the generated sections
;   pio run -t upload           flash it
;
; A build never regenerates on its own. Rewriting your source tree as a side
; effect of compiling is how a half-finished edit gets clobbered, and a build has
; no terminal to ask from - under CI, in an IDE, or in the background. So it
; stops and tells you the command.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

lib_deps =
  MarikTik/etask

extra_scripts =
  pre:$PROJECT_LIBDEPS_DIR/$PIOENV/etask/scripts/platformio/etask_build.py

; --- etask paths (all optional; these are the defaults) ---------------------
; The schema is the one source of truth for the task set and the wire protocol.
custom_etask_schema = schema.yaml
; Task scaffolds: created once, then yours. Under src/, so PlatformIO compiles them.
custom_etask_src = src/sys
; Always-regenerated projections of the schema. Also under src/ - they include
; the contexts next to them, and PlatformIO's lib/ cannot reach back into src/.
custom_etask_generated = src/generated
; Uncomment to also emit the typed Python client a PC or Pi drives this board with.
; custom_etask_python = python/tasks.py

; This node's identity on the wire (1..254), used when it starts tasks itself.
build_flags =
  -D ECOMM_BOARD_ID=1
