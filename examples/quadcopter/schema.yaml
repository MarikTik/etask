# examples/quadcopter/schema.yaml
#
# A quadcopter flight controller. Four rotors, a small sensor suite, and a
# navigation layer, plus a top-level failsafe. The four rotors are one abstract
# scope expanded per position (front-left, front-right, rear-left, rear-right),
# so a single rotor definition yields four instances with distinct uids
# (sys::rotors::fl::set_thrust, ...).
#
# A different shape from the humanoid example on purpose: there the tree was
# limb-pairs (arms/legs); here it is a rotor *array* feeding a controller, a
# read-only sensor suite, and a nav layer that commands them. Between the two,
# every generator feature is exercised:
#   - nested concrete scopes            (sensors.imu.read, nav.*)
#   - an abstract scope -> instances    (rotor -> fl/fr/rl/rr)
#   - params + named and positional returns
#   - concurrency -> capacity<T, N>     (all four rotors spin at once)
#   - brief + description documentation
#   - a root-level task (failsafe) that receives sys::context and, through
#     it, can reach every rotor to cut thrust - the reason a system-level task
#     is handed the composition root rather than a single subsystem.

rotors:
  type: scope
  brief: the four-rotor array
  description: |
    The lift plant. Each rotor is an ESC-driven brushless motor; all four are
    commanded together every control tick, so set_thrust is concurrent.
  children:
    rotor:
      type: abstract_scope
      instances: [fl, fr, rl, rr]     # front/rear x left/right
      children:
        set_thrust:
          type: task
          brief: drive this rotor to a thrust level
          description: |
            Ramps the ESC toward a normalized thrust in [0, 1]. Runs alongside
            the other three rotors, so it declares concurrency.
          params: { level: float }
          concurrency: 4
        stop:
          type: task
          brief: cut this rotor immediately
          params: {}

sensors:
  type: scope
  brief: the flight sensor suite
  children:
    imu:
      type: scope
      brief: inertial measurement unit
      children:
        read:
          type: task
          brief: sample accel + gyro
          description: |
            One-shot read of the six IMU axes (three accelerometer, three
            gyroscope). Samples in on_execute() and reports finished.
          params: {}
          returns: { ax: float, ay: float, az: float, gx: float, gy: float, gz: float }
    baro:
      type: scope
      brief: barometric altimeter
      children:
        read_altitude:
          type: task
          brief: read altitude above the launch point
          params: {}
          returns: { meters: float }
    gps:
      type: scope
      brief: satellite positioning
      children:
        fix:
          type: task
          brief: acquire a position fix
          description: |
            Returns latitude and longitude in degrees and the number of
            satellites used. May take several ticks to converge.
          params: {}
          returns: [double, double, uint8]      # positional: lat, lon, sats

nav:
  type: scope
  brief: the navigation layer
  description: |
    Turns high-level intent into rotor commands. Holds no hardware of its own;
    its context reaches into the rotor and sensor subsystems it coordinates.
  children:
    fly_to:
      type: task
      brief: fly to a waypoint
      description: |
        Drives the craft toward a target latitude/longitude/altitude, holding
        until it arrives. Long-running: keeps working across many ticks.
      params: { lat: double, lon: double, alt: float }
    hold:
      type: task
      brief: hold the current position
      params: {}
    land:
      type: task
      brief: descend and touch down
      params: {}

failsafe:
  type: task
  uid: 255                              # reserved, always-reachable emergency uid
  brief: emergency stop - cut every rotor now
  description: |
    The highest-authority task. It receives sys::context (the composition
    root) and cuts thrust on all four rotors, then holds them off. Because it
    reaches the whole machine, it is a root-level task - its scope is the system
    itself, not any single subsystem.
  params: {}
