; The ESP32 half of the `all_tiers` integration project (see project/ci-plan.md).
;
; Builds the same sources as the CMake host build, so the conformance run is the
; same run on both targets and a lifecycle difference between them shows up as a
; differing report rather than as a project that only exists on one side.
;
;   pio run -e esp32dev                     build (refuses if the schema moved ahead)
;   pio run -e esp32dev -t etask-generate   rewrite the generated sections
;   pio run -e esp32dev -t upload           flash it
;   pio device monitor -b 115200            watch the report
;
; The board prints exactly what the host binary prints, so the same driver
; checks either:
;
;   pio device monitor -b 115200 | tee serial.log     # until 'etask done'
;   python3 verify.py --log serial.log
;
; A build never regenerates on its own - see scripts/platformio/etask_build.py
; for why a build that rewrites your source tree is the wrong default.

[platformio]
; This project keeps its sources at the project root rather than under src/, so
; that one tree serves both build systems: CMake takes the project root as its
; single include root, and pointing src_dir here gives PlatformIO the same set -
; main.cpp, app.cpp, the scenario driver under support/, and the generated task
; bodies under sys/.
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; -- Dependencies, found on disk rather than fetched -------------------------
;
; etask is the checkout this project sits two levels inside, which is the whole
; point: the project exists to test *that* library, not the registry's copy of
; it. A `symlink://` because it is the one dependency that is not a sibling.
;
; Its siblings are not published on the PlatformIO registry at all, so they are
; found by name in a directory of checkouts. Override that when they live
; elsewhere:
;
;   pio run -e esp32dev --project-option="lib_extra_dirs=/path/to/elib"
lib_extra_dirs =
  ~/Desktop/projects/elib

lib_deps =
  symlink://../..
  ecomm
  etools
  eser

; Referenced through the checkout rather than $PROJECT_LIBDEPS_DIR, because a
; symlinked dependency is materialized as a link file rather than as the
; unpacked package directory that path assumes. A project consuming etask from
; the registry uses the $PROJECT_LIBDEPS_DIR form - see examples/esp8266_blink.
extra_scripts =
  pre:../../scripts/platformio/etask_build.py

; -- etask paths -------------------------------------------------------------
; The defaults assume sources under src/; this project keeps them at the root
; (see [platformio] above), so both are named explicitly.
custom_etask_schema = schema.yaml
custom_etask_src = sys
custom_etask_generated = generated
custom_etask_python = python/tasks.py

; -- Build -------------------------------------------------------------------
; C++17 is stated rather than assumed: the Arduino ESP32 core still defaults to
; gnu++11, under which eser refuses to compile at all ("C++17 or newer is
; required"). It has to be set for the linker driver too, or the standard
; library selected at link time disagrees with the one compiled against.
build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -I.
  -D ECOMM_BOARD_ID=1

; main.cpp carries both entry points behind `#ifdef ARDUINO`, so it is compiled
; here too - only `build/`, the CMake output tree, has to be kept out of a build
; that shares the project root with it.
build_src_filter =
  +<*>
  -<build/>
