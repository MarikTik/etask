; The ESP32 half of the bombardment integration test.
;
; Same sources as the CMake build, same checks, same transcript - printed to the
; serial monitor instead of stdout. The point is not that a second target can
; also run the suite; it is that the suite's conclusions are about a device with
; 320 KB of RAM and no heap allocations, and a result only ever measured on a
; desktop is a result about a desktop.
;
;   pio run -e esp32dev                 build (refuses if the schema moved ahead)
;   pio run -e esp32dev -t etask-generate   rewrite the generated sections
;   pio run -e esp32dev -t upload           flash it
;   pio device monitor -b 115200            read the transcript
;
; There is no verify.py for this side. The driver's job is to insist every check
; reported and to explain what failed, and it does that by reading the harness's
; exit status and stdout - neither of which a board has. On a board the
; transcript on the monitor is the report, which is why every check prints its
; own verdict rather than only counting them.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; The framework under test comes from the checkout this project sits in, not from
; the registry - the same reasoning as ETASK_ROOT in CMakeLists.txt. A published
; etask would make the test pass or fail on code nobody here is editing.
;
; `symlink://` rather than a plain path so the library is *referenced* in place:
; a copy would go stale the moment a header next door is edited, which is the one
; thing this project must never do.
;
; etask's own dependencies are named here too, and for a reason worth writing
; down: the registry does not carry ecomm, etools, or eser, so resolving etask's
; declared dependencies through it fails with a warning and then a build that
; dies much later on a missing header. Naming local checkouts is what makes that
; a controlled arrangement rather than a broken one.
;
; The paths assume the elib layout - etask, etools, ecomm and eser as siblings -
; and are relative to *this project*, which PlatformIO is what resolves them
; against. If your checkouts live elsewhere, this is the line to edit; the
; CMake build has no equivalent because it fetches these itself.
lib_deps =
  symlink://../..
  symlink://../../../etools
  symlink://../../../ecomm
  symlink://../../../eser

; The integration script normally comes from the installed library, addressed as
; $PROJECT_LIBDEPS_DIR/$PIOENV/etask/... - but a `symlink://` dependency leaves a
; link marker there rather than a directory, so that path does not resolve. The
; checkout is right here, so name it directly.
extra_scripts =
  pre:../../scripts/platformio/etask_build.py

; --- etask paths ------------------------------------------------------------
; Identical to what CMakeLists.txt passes etask_add_schema(), so both builds
; check the same generated files against the same schema and neither can be
; satisfied by output the other would reject.
custom_etask_schema = schema.yaml
custom_etask_src = src/sys
custom_etask_generated = src/generated

; src/host_main.cpp defines a plain `main()`, which the Arduino core also
; defines - compiling both is a duplicate-symbol link error. src/main.cpp is
; this target's entry point; see the note in host_main.cpp for why the two exist.
build_src_filter =
  +<*>
  -<host_main.cpp>

; The C++ standard has to be set here, not left to the library. etask's
; library.json carries `-std=gnu++17`, but PlatformIO applies a library's build
; flags to that library's own sources - and etask is header-only, so it has
; none. The project's sources are what actually instantiate those headers, and
; without this they compile under the Arduino core's default (gnu++11), failing
; deep inside etools on `std::is_same_v` with nothing pointing back here.
;
; `build_unflags` first because the core puts its own -std on the command line;
; appending a second one is order-dependent and quietly wrong on some toolchains.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  ; This node's identity on the wire (1..254). Nothing here talks to a peer, but
  ; internal_channel stamps it onto every task it starts, so it has to exist.
  -D ECOMM_BOARD_ID=1
