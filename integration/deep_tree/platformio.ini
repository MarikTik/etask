; integration/deep_tree/platformio.ini
;
; The embedded half of this integration test. The host build (CMakeLists.txt
; beside this) answers whether the uids are right; this one answers whether a
; tree of this size is something a real target can carry at all.
;
;   pio run -e esp32dev            build (refuses if the schema moved ahead)
;   pio run -e esp32dev -t etask-generate   rewrite the generated sections
;   pio run -e esp32dev -t upload  flash it
;
; ## esp32, and not esp8266
;
; The reference PlatformIO example (examples/esp8266_blink) targets an ESP8266,
; and this project deliberately does not. 294 tasks across three managers, with
; a 73-node context tree and a two-byte uid space, is a different order of thing
; from four tasks on an LED: the registries alone are 294 constructor entries.
; An ESP8266's ~50 KB of usable RAM and 1 MB flash partition is the wrong target
; to find that out on, and a size failure there would say more about the board
; than about the generator.
;
; ## SIZE: the full tree does NOT fit an ESP32, and that is a result
;
; Everything here compiles for xtensa. It does not link at the schema's full
; size, and the number it fails by is the most useful thing this env produces.
;
; Measured on this core (Arduino-ESP32 3.20017, gcc 8.4.0, -Os), varying only
; the mesh's `segment` instance count:
;
;   segments  tasks  flash      per task   RAM
;   2         102    0.91 MB     9.4 KB    26.6 KB
;   4         198    2.37 MB    12.6 KB    27.2 KB
;   5         246    3.42 MB    14.6 KB    27.5 KB
;   6         294    (link fails: rodata over by 163,240 bytes)
;
; Three things in that table, in descending order of how much they matter.
;
; **The ceiling is rodata, and no setting moves it.** `drom0_0_seg` is 4 MB, set
; in the core's memory.ld, and the 294-task build wants about 4.16 MB of
; constant data. That is not the app partition: the same 163,240-byte overflow
; appears with the stock 1.25 MB table, with `huge_app.csv`'s 3 MB, and with a
; hand-written 6 MB one. A bigger flash part does not help either. On this core
; the tree simply has a maximum size, and it is somewhere between 246 and 294
; tasks - call it 250.
;
; **Flash grows faster than the task count**, which is why the ceiling arrives
; sooner than a linear estimate predicts. Doubling 102 tasks to 198 costs 2.6x
; the flash, and the per-task column climbs from 9.4 KB to 14.6 KB across the
; measured range. Each task brings a registry entry, an unpack adapter
; instantiated over its own argument types, and a vtable, and the dispatch
; tables grow with their tier. Anyone sizing a device from a small prototype
; should extrapolate from two measurements, never one.
;
; **RAM barely moves at all** - 26.6 KB to 27.5 KB across 144 extra tasks, on a
; 320 KB part. That is `budget:` doing exactly what it claims: the managers hold
; their records inline, sized by the budget rather than by how many task *types*
; exist, so a tree this size is a flash problem and very nearly not a RAM one.
; It is the opposite of what the flash column suggests, and it is the number
; that decides whether a device runs.
;
; ## What to do about it
;
; Nothing, here. This env is left pointing at the full schema deliberately: the
; host build and verify.py are what test the tree's structure, and they need it
; past 256 tasks to test the uid width at all. Shrinking the schema so this env
; goes green would trade the thing being tested for a passing build.
;
; To build a version that flashes, lower the mesh's `segment` instances to five
; in schema.yaml, regenerate, and delete the orphaned src/sys/mesh/s5/ - see the
; note on orphaned scaffolds in verify.py. That is a 246-task tree at 3.42 MB,
; and it needs partitions_deep_tree.csv beside this file, because every stock
; table tops out at 3 MB.
;
; ## Why the libraries are local symlinks, and not registry names
;
; A normal project writes `lib_deps = MarikTik/etask` and PlatformIO fetches
; that release and its whole dependency chain (ecomm -> etools -> eser) from the
; registry. That is the right thing for a user and the wrong thing here: this
; project lives *inside* the etask repository and exists to test the working
; tree, so a registry copy would be testing a different etask from the one being
; edited. CMakeLists.txt beside this file adds the repo root for the same
; reason.
;
; The chain has to be spelled out because a symlinked library's own
; `dependencies` are still resolved against the registry, so etask's declared
; ecomm/etools would be fetched even though local checkouts exist. Naming all
; four pins every one of them to the sibling directory.
;
; The paths assume the standard elib layout - the four repositories side by side
; in one directory - which is what a developer running this has.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; An 8 MB module and a 6 MB single-app partition. Both are overrides of the
; esp32dev defaults (4 MB, 1.25 MB app), and both are needed: see the size table
; above. Declaring the flash size as well as the table is not redundant - the
; table addresses past 0x400000 are meaningless on a 4 MB part, and esptool
; refuses the image rather than silently truncating it.
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions_deep_tree.csv

; The whole elib chain, from the checkouts beside this one. See the note above.
lib_deps =
  symlink://../..
  symlink://../../../ecomm
  symlink://../../../etools
  symlink://../../../eser

; Named against the checkout rather than against $PROJECT_LIBDEPS_DIR, which is
; what a registry-installed project uses. A symlinked library is not unpacked
; into libdeps - only a link file is written there, under the *directory's* name
; rather than the library's - so the conventional path would not resolve.
extra_scripts =
  pre:../../scripts/platformio/etask_build.py

; --- etask paths ------------------------------------------------------------
; These are the integration's defaults, restated so the two build systems can be
; read side by side: CMakeLists.txt names the identical four paths.
custom_etask_schema = schema.yaml
custom_etask_src = src/sys
custom_etask_generated = src/generated
custom_etask_python = python/tasks.py

; `main.cpp` is the *host* entry point: it speaks the stdin protocol verify.py
; drives, over <iostream>. The board's entry point is `board_main.cpp`, which
; forwards the Arduino hooks to app::setup()/app::loop(). Both live under src/
; because PlatformIO compiles nothing else, so exactly one of them has to be
; filtered out here - and it is the one that would drag a hosted C++ library
; onto an MCU.
build_src_filter =
  +<*>
  -<main.cpp>

; C++17 has to be asked for here, not inherited. etask's library.json carries
; `-std=gnu++17`, but a library's build flags apply to the *library's* own
; sources; this project's `src/` is compiled with the framework's default, which
; on this Arduino core is gnu++11. Since every etask header is included from
; src/, the whole build then fails on things like `std::byte` and `std::apply`
; with errors that point at the library rather than at the standard - so the
; unflag/flag pair below is doing real work and is not boilerplate.
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  ; This node's identity on the wire (1..254), used when it starts tasks itself.
  -D ECOMM_BOARD_ID=1
