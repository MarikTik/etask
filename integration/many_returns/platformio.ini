; integration/many_returns on PlatformIO - the same project the CMake host build
; compiles, cross-compiled for an ESP32.
;
;   pio run -e esp32dev              build (refuses if the schema moved ahead)
;   pio run -e esp32dev -t etask-generate   rewrite the generated sections
;   pio run -e esp32dev -t upload    flash it
;   pio device monitor               read the transcript the harness prints
;
; A build never regenerates on its own: rewriting a source tree as a side effect
; of compiling is how a half-finished edit gets clobbered, and a build has no
; terminal to ask from. So a stale build stops and names the command.
;
; ## Why the board build matters to a *reply* test
;
; The point is not that an ESP32 can print a hex dump. It is that the frames it
; prints must be byte-identical to the host's. Xtensa is 32-bit where the host is
; 64, so `sizeof(std::size_t)` differs, alignment rules differ, and a `bool` need
; not be one byte on either. Every one of those could silently resize a packet or
; shift a field - which is exactly why `packet_size_for` rounds to a literal 8
; rather than to the local word. Running the same verify.py against both
; transcripts is what proves it worked.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The etask under test is the one in this repository, not a released tag. An
; integration project that pulled `MarikTik/etask` from the registry would test a
; published version while the branch it lives on was broken - the exact failure
; this project exists to catch. Two levels up from here is the repo root.
;
; The siblings are named too, and for the same reason. etask's library.json
; declares them as registry dependencies (`MarikTik/ecomm ^3.1.0`), which is
; right for a consumer and wrong here: this project must compile against the
; ecomm and etools sitting beside etask in the elib checkout, not against
; whatever the registry last published. Naming them explicitly takes precedence
; over the transitive requirement.
;
; The `name=uri` form is not decoration: without it PlatformIO names the package
; after the *directory* it points at, which under a git worktree is a generated
; name, and the extra_scripts path below would not resolve.
lib_deps =
  etask=symlink://../..
  ecomm=symlink://../../../ecomm
  etools=symlink://../../../etools
  eser=symlink://../../../eser

extra_scripts =
  pre:$PROJECT_LIBDEPS_DIR/$PIOENV/etask/scripts/platformio/etask_build.py

; --- etask paths (all optional; these are the defaults) ---------------------
; The schema is the one source of truth for the task set and the wire protocol.
custom_etask_schema = schema.yaml
; Task scaffolds: created once, then yours. Under src/, so PlatformIO compiles them.
custom_etask_src = src/sys
; Always-regenerated projections of the schema. Also under src/ - they include
; the contexts next to them, and PlatformIO's lib/ cannot reach back into src/.
custom_etask_generated = src/generated
; The typed client verify.py decodes replies with. Same file the CMake build
; generates, so the two targets cannot drift into two different clients.
custom_etask_python = python/tasks.py

; main.cpp is the host's entry point and defines `int main()`, which the Arduino
; core already supplies - compiling both is a duplicate symbol. arduino_main.cpp
; is its counterpart and forwards the same two app:: hooks, so everything above
; the entry point is identical on both targets. The CMake build makes the
; opposite choice, and that difference is the only one between them.
build_src_filter = +<*> -<main.cpp>

; The language standard has to be stated here, and it is the one setting a board
; build most easily gets wrong. etask's library.json carries `-std=gnu++17`, but
; those flags apply to the *library's* own translation units - this project's
; src/ is compiled with the Arduino core's default, which is gnu++11. Building
; C++17 headers under it does not fail cleanly: eser's `#error` fires first, and
; behind it come a dozen errors that read like the library is broken rather than
; like the standard is wrong.
;
; -std= alone is not enough either. The core puts its own `-std=gnu++11` on the
; command line, and the last one wins only sometimes; `build_unflags` removes it
; so there is exactly one standard flag rather than two in an order nobody
; controls.
;
; This node's identity on the wire (1..254), used when it starts tasks itself.
; -Wall -Wextra -Werror matches the CMake build: an integration project exists to
; catch what a warning would have caught, and a warning that only fires on one of
; the two targets is precisely the kind worth failing on.
build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -D ECOMM_BOARD_ID=1
  -Wall
  -Wextra
  -Werror

; Must match `console_baud` in src/arduino_main.cpp. Stated in both places
; because neither the sketch nor this file can read the other.
monitor_speed = 115200
