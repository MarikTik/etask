; integration/multi_link on PlatformIO - the ESP32 half of the same project.
;
;   pio run -e esp32dev            build (refuses if the schema moved ahead)
;   pio run -e esp32dev -t etask-generate   rewrite the generated sections
;
; This builds the *same sources* the CMake host build does - there is no second
; copy of the task tree, and no `src/` mirror. That is the point of the exercise:
; the per-link machinery is compile-time (the frame sizes, the `carries()`
; allowlist, the fingerprint), so a claim proven on the host is only worth
; something if the board compiles the identical headers to the identical sizes.
;
; A build never regenerates on its own. Rewriting a source tree as a side effect
; of compiling is how a half-finished edit gets clobbered, and a build has no
; terminal to ask from - under CI, in an IDE, or in the background. So it stops
; and names the command.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The checkouts this project lives beside, not the registry packages. An
; integration test must compile the working tree it ships with - resolving
; `MarikTik/etask` from the registry would build whatever was last published and
; quietly stop testing the change under review.
;
; The elib siblings are named explicitly because etask's library.json declares
; them as registry dependencies, and a symlinked etask cannot pull local copies
; of its own dependencies transitively.
lib_deps =
  symlink://../..
  symlink://../../../etools
  symlink://../../../ecomm
  symlink://../../../eser

extra_scripts =
  pre:../../scripts/platformio/etask_build.py

; --- etask paths ------------------------------------------------------------
; Pointed at the project root rather than PlatformIO's usual `src/` layout,
; because this project is laid out the way the CMake build and the README
; describe: the root IS the include root, so `#include "generated/links.hpp"`
; and `#include "support/channels/stream_channel.hpp"` resolve from any depth
; with no `../`. Keeping one layout for both build systems is what makes the two
; builds comparable; mirroring the tree under `src/` would give the board its
; own copy to drift.
custom_etask_schema = schema.yaml
custom_etask_src = sys
custom_etask_generated = generated
custom_etask_python = python/tasks.py

; PlatformIO compiles `src/` by default. This project keeps its sources at the
; root, so the root is named as the source directory and the build tree is kept
; out of the way of the host build's `build/`.
[platformio]
src_dir = .
build_dir = .pio/build

; The root as include root (see above), and this node's identity on the wire.
; ECOMM_BOARD_ID must agree with the CMake build and with verify.py's DEVICE_ID,
; or `net` - the addressed link - would drop every frame as not-for-me.
[env]
; `-std=gnu++17` is stated here rather than left to etask's library.json. A
; library's own build flags apply to that library, not to the project's sources,
; and the ESP32 Arduino core still defaults its application build to gnu++11 -
; against which the whole elib chain fails to parse. The symptom is a wall of
; errors inside etools and eser rather than anything naming a standard, so it is
; worth pinning explicitly even where a newer core would not need it.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -I.
  -D ECOMM_BOARD_ID=1

; With the project root as `src_dir`, everything under it is a build candidate -
; including the CMake host build's `build/`, which contains fetched dependency
; checkouts complete with their own examples and benchmarks. Those are not this
; project's sources and do not compile for an ESP32, so the filter names what is
; wanted rather than trying to enumerate what is not.
;
; `main.cpp` is excluded too: it is the host harness entry point, taking link
; descriptors on argv. An Arduino build supplies its own `setup`/`loop`, which
; is what `arduino_main.cpp` provides.
build_src_filter =
  -<*>
  +<app.cpp>
  +<arduino_main.cpp>
  +<sys/>
  +<support/>
