; integration/wide_params - the ESP32 half.
;
; The device half of the type round-trip test. CMakeLists.txt builds the same
; src/ tree for the host; this builds it for Xtensa, and the difference between
; the two is the entire subject of the project. A 64-bit host and a 32-bit
; ESP32 disagree about the width of a word, the alignment a double wants, and
; how a compiler lays out a struct - and a flat, tagless codec has to be
; indifferent to all three.
;
;   pio run -e esp32dev            build (refuses if the schema moved ahead)
;   pio run -e esp32dev -t etask-generate    rewrite the generated sections
;   pio run -e esp32dev -t upload            flash it
;
; A build never regenerates on its own: rewriting the source tree as a side
; effect of compiling can clobber a half-finished edit, and a build has no
; terminal to ask from under CI. It stops and names the command instead.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; The etask checkout this project is sitting in, not the published library.
;
; An integration project exists to catch a regression in the working tree, and
; one built against the registry's `MarikTik/etask` would pass while the tree
; two directories up was broken - which is the one outcome that makes it
; worthless. A copy of this directory lifted out of the repo wants
; `MarikTik/etask` instead.
;
; ecomm and etools are named explicitly for the same reason. etask's
; library.json depends on the registry versions of both, so leaving them
; implicit would build the working tree's etask against published siblings and
; quietly test a combination nobody ships.
; eser is named too, though nothing here includes it directly: it is etools'
; dependency, and the chain has to be pinned at every link or the one unpinned
; hop reintroduces exactly the published-vs-working-tree mix this avoids.
lib_deps =
  symlink://../..
  symlink://../../../ecomm
  symlink://../../../etools
  symlink://../../../eser

; The freshness check and the etask-generate target.
;
; The path is the repo's own copy, not
; `$PROJECT_LIBDEPS_DIR/$PIOENV/etask/scripts/...` as etask_build.py's docstring
; and examples/esp8266_blink both show. That form requires etask to have been
; unpacked into libdeps as a real directory, which is what a registry install
; does - a `symlink://` dependency leaves an `etask.pio-link` *file* there
; instead, and SCons fails with "missing SConscript file" before the build
; starts. A project consuming etask from the registry should use the documented
; form; this one cannot, because it consumes the tree it lives in.
extra_scripts =
  pre:../../scripts/platformio/etask_build.py

; --- etask paths ------------------------------------------------------------
; The schema is the one source of truth for the task set and the wire protocol,
; and it is the *same file* CMakeLists.txt names. Two schemas would make the two
; builds two projects that merely resemble each other.
custom_etask_schema = schema.yaml
; Task scaffolds: created once, then ours. Under src/, so PlatformIO compiles them.
custom_etask_src = src/sys
; Always-regenerated projections of the schema. Also under src/ - they include the
; contexts next to them, and PlatformIO's lib/ cannot reach back into src/.
custom_etask_generated = src/generated
; The host driver's half of the contract. verify.py imports these bindings, so
; they are generated here as well as by the CMake build - from one schema, which
; is what makes the fingerprints match.
custom_etask_python = python/tasks.py

; The language standard has to be stated here, and this is not optional.
;
; etask, ecomm, etools and eser each carry `-std=gnu++17` in their library.json,
; but a library's build flags apply to that library's own sources - and all four
; are header-only, with an empty srcDir. Nothing they declare reaches src/. The
; ESP32 Arduino core still defaults to gnu++11, so without this line the first
; thing that fails is eser's own `#error "[eser] C++17 or newer is required."`,
; several includes deep and pointing at a file this project never names.
;
; `build_unflags` as well as `build_flags`: the core puts its own -std= on the
; command line, and two of them is the core's, not ours, on some toolchains.
;
; examples/esp8266_blink has neither line. It has only ever been built with a
; locally overridden dependency set, which is also how its `MarikTik/etask`
; lib_deps line has gone unnoticed - that package is not in the registry.
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  ; This node's identity on the wire (1..254), used when it starts tasks itself.
  -D ECOMM_BOARD_ID=1
